<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0d10">

    <title>Particles</title>
    <style>
        :root {
            --bg: #0c0d10;
            --panel: rgba(16, 18, 24, 0.82);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #edf1f5;
            --muted: #93a0b0;
            --accent: #7eb6ff;
            --accent-strong: #4d94f0;
            --chip: rgba(255, 255, 255, 0.06);
            --danger: #ff7a59;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            color-scheme: dark;
        }
        canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }
        #simCanvas3d { display: none; }

        #hud {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 5;
            pointer-events: none;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            color: rgba(237, 241, 245, 0.78);
            background: rgba(8, 10, 14, 0.45);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 7px 10px;
            backdrop-filter: blur(10px);
            line-height: 1.45;
            text-align: right;
        }

        #controls {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            width: 292px;
            max-height: calc(100dvh - 24px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(16px);
        }
        #controls.collapsed {
            width: auto;
            overflow: visible;
            padding: 6px;
        }
        #controls.collapsed .panel-body,
        #controls.collapsed .panel-footer,
        #controls.collapsed .panel-copy { display: none; }
        .panel-body {
            overflow: auto;
            flex: 1 1 auto;
            min-height: 0;
            overscroll-behavior: contain;
            padding-right: 2px;
            padding-bottom: 8px;
        }
        .panel-footer {
            flex: 0 0 auto;
            padding-top: 10px;
        }

        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }
        #controls.collapsed .panel-header { margin: 0; }
        .panel-copy h1 {
            margin: 0;
            font-size: 1.02rem;
            font-weight: 650;
            letter-spacing: 0.01em;
        }
        .panel-copy p {
            margin: 2px 0 0;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .icon-btn {
            flex: 0 0 auto;
            width: 32px;
            height: 32px;
            border: 1px solid var(--panel-border);
            background: var(--chip);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .section { margin-top: 12px; }
        .section-title {
            font-size: 0.68rem;
            font-weight: 650;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .control-group { margin-bottom: 10px; }
        .control-group:last-child { margin-bottom: 0; }

        label.row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.82rem;
            color: #c5ced8;
            user-select: none;
        }
        .value {
            color: var(--text);
            font-variant-numeric: tabular-nums;
            font-size: 0.78rem;
        }
        .hint {
            margin-top: 4px;
            font-size: 0.72rem;
            color: var(--muted);
            line-height: 1.35;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            margin: 8px 0 0;
            background: #2a3140;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {

            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            box-shadow: 0 0 0 3px rgba(126, 182, 255, 0.16);
        }
        input[type=range]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
        }

            color: var(--text);

            border-radius: 6px;
            padding: 4px 6px;

        select {

            background: #171b22;
            color: var(--text);
            border: 1px solid #323846;
            border-radius: 8px;

        select:focus, input:focus, button:focus-visible {

        }

        .chip-row {

            gap: 6px;
            margin-top: 8px;

        .chip {

            border: 1px solid var(--panel-border);
            background: var(--chip);
            color: var(--text);

        .toggle-row {

        .btn-row {

            border: none;

        .btn-primary { background: var(--accent-strong); color: #fff; }
        .btn-primary:hover { background: #3b82e0; }
        .btn-secondary {

            color: var(--text);

        .btn-danger { background: #3a2422; color: #ffb4a4; border: 1px solid #5a3530; }

        body.renderer-3d .view-3d-only { display: block; }
        body:not(.is-mobile) .desktop-only { display: block; }

        body.is-mobile #controls {

            max-height: min(74vh, calc(100dvh - 16px));

        body.is-mobile .legend-labels { display: none; }

function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function smoothstep(a, b, x) {
    const t = clamp((x - a) / Math.max(1e-6, b - a), 0, 1);
    return t * t * (3 - 2 * t);
}

function phaseAt(tempC, mat) {
    const melt = mat.meltTemp;
    const boil = mat.boilTemp;
    const mw = Math.max(10, Math.abs(boil - melt) * 0.18);
    const solid = 1 - smoothstep(melt - mw, melt + mw, tempC);
    const gas = smoothstep(boil - mw, boil + mw * 1.4, tempC);
    const liquid = Math.max(0, 1 - solid - gas);
    return { solid, liquid, gas };
}

function phaseLabel(phase) {
    if (phase.solid >= 0.55) return 'solid';
    if (phase.gas >= 0.45) return 'gas';
    return 'liquid';
}

function hslToRgb(h, s, l) {
    const sat = s / 100;
    const light = l / 100;
    const c = (1 - Math.abs(2 * light - 1)) * sat;
    const hh = ((h % 360) + 360) % 360 / 60;
    const x = c * (1 - Math.abs(hh % 2 - 1));
    let r = 0, g = 0, b = 0;
    if (hh < 1) [r, g, b] = [c, x, 0];
    else if (hh < 2) [r, g, b] = [x, c, 0];
    else if (hh < 3) [r, g, b] = [0, c, x];
    else if (hh < 4) [r, g, b] = [0, x, c];
    else if (hh < 5) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];
    const m = light - c / 2;
    return {
        r: Math.round((r + m) * 255),
        g: Math.round((g + m) * 255),
        b: Math.round((b + m) * 255)
    };
}

function bondKey(i, j) {
    return i < j ? (i + ':' + j) : (j + ':' + i);
}

function allocBucket() {
    if (bucketsUsed < bucketPool.length) {
        const b = bucketPool[bucketsUsed++];
        b.length = 0;
        return b;
    }
    const b = [];
    bucketPool.push(b);
    bucketsUsed++;
    return b;
}

function buildSpatialHash(cellSize) {
    spatial.clear();
    bucketsUsed = 0;
    hashCell = Math.max(8, cellSize);
    const use3d = rendererMode === '3d';
    const half = simDepth / 2;
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const cx = Math.floor(p.x / hashCell);
        const cy = Math.floor(p.y / hashCell);
        const cz = use3d ? Math.floor((p.z + half) / hashCell) : 0;
        const key = use3d ? cx + ',' + cy + ',' + cz : cx + ',' + cy;
        let bucket = spatial.get(key);
        if (!bucket) {
            bucket = allocBucket();
            spatial.set(key, bucket);
        }
        bucket.push(i);
    }
}

function forEachInCells(i, fn) {
    const p = particles[i];
    const use3d = rendererMode === '3d';
    const cx = Math.floor(p.x / hashCell);
    const cy = Math.floor(p.y / hashCell);
    const cz = use3d ? Math.floor((p.z + simDepth / 2) / hashCell) : 0;
    const z0 = use3d ? -1 : 0;
    const z1 = use3d ? 1 : 0;
    for (let oz = z0; oz <= z1; oz++) {
        for (let oy = -1; oy <= 1; oy++) {
            for (let ox = -1; ox <= 1; ox++) {
                const key = use3d
                    ? (cx + ox) + ',' + (cy + oy) + ',' + (cz + oz)
                    : (cx + ox) + ',' + (cy + oy);
                const bucket = spatial.get(key);
                if (!bucket) continue;
                for (let n = 0; n < bucket.length; n++) fn(bucket[n]);
            }
        }
    }
}

class Particle {
    constructor(x, y, z) {
        this.x = x;
        this.y = y;
        this.z = z || 0;
        this.vx = 0;
        this.vy = 0;
        this.vz = 0;
        this.tempC = ambientTemp;
        this.displayHeat = 0;
        this.density = 1;
        this.pressure = 0;
        this.neighborSet = new Set();
        this.trail = new Float32Array(TRAIL_LENGTH * 3);
        this.trailIndex = 0;
        this.trailCount = 0;
    }

    integrate() {
        const mat = materials[currentMaterialKey];
        const phase = phaseAt(this.tempC, mat);
        this.applyHeatAndJitter(phase);
        this.vy += physicsParams.gravity;
        this.x += this.vx;
        this.y += this.vy;
        if (rendererMode === '3d') this.z += this.vz;

        const damp = lerp(physicsParams.friction, 0.998, phase.gas);
        this.vx *= damp;
        this.vy *= damp;
        this.vz *= damp;
        this.limitSpeed();
        this.applyBounds(phase);
        this.relaxTemp();
        this.recordTrail();
    }

    applyHeatAndJitter(phase) {
        const heatJitter = 0.035 + phase.liquid * 0.06 + phase.gas * 0.55;
        const tScale = clamp((this.tempC - TEMP_MIN) / (TEMP_MAX - TEMP_MIN), 0, 1);
        const j = physicsParams.jitter * heatJitter * (0.25 + tScale);
        this.vx += (Math.random() - 0.5) * j;
        this.vy += (Math.random() - 0.5) * j;
        if (rendererMode === '3d') this.vz += (Math.random() - 0.5) * j * 0.7;

        if (!mouse.isDown) return;
        const radius = getHeatRadius();
        let dist;
        let nx = 0;
        let ny = 0;
        let nz = 0;
        if (rendererMode === '3d' && heatPoint.valid) {
            const px = this.x - simWidth / 2;
            const py = -(this.y - simHeight / 2);
            const pz = this.z;
            const dx = px - heatPoint.x;
            const dy = py - heatPoint.y;
            const dz = pz - heatPoint.z;
            dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (dist < 1e-6) return;
            nx = dx / dist;
            ny = -dy / dist;
            nz = dz / dist;
        } else {
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 1e-6) return;
            nx = dx / dist;
            ny = dy / dist;
        }
        if (dist >= radius) return;
        const falloff = 1 - dist / radius;
        this.tempC = Math.min(TEMP_MAX + 400, this.tempC + 17 * falloff);
        this.vx += nx * falloff * 1.15 + (Math.random() - 0.5) * 1.6 * falloff;
        this.vy += ny * falloff * 1.15 + (Math.random() - 0.5) * 1.6 * falloff;
        if (rendererMode === '3d') {
            this.vz += nz * falloff * 1.15 + (Math.random() - 0.5) * 1.1 * falloff;
        }
    }

    limitSpeed() {
        const max = simMode === 'fluid' ? 22 : MAX_SPEED;
        const s2 = this.vx * this.vx + this.vy * this.vy + this.vz * this.vz;
        if (s2 > max * max) {
            const scale = max / Math.sqrt(s2);
            this.vx *= scale;
            this.vy *= scale;
            this.vz *= scale;
        }
    }

    applyBounds(phase) {
        const r = particleRadius;
        const rest = phase.gas > 0.5 ? 0.42 : (phase.solid > 0.5 ? 0.08 : 0.16);
        const nudge = 0.12;
        if (this.x < r) { this.x = r; this.vx = Math.abs(this.vx) * rest + nudge; }
        else if (this.x > simWidth - r) { this.x = simWidth - r; this.vx = -Math.abs(this.vx) * rest - nudge; }
        if (this.y < r) { this.y = r; this.vy = Math.abs(this.vy) * rest + nudge; }
        else if (this.y > simHeight - r) {
            this.y = simHeight - r;
            this.vy = -Math.abs(this.vy) * rest;
            this.vx *= 0.92;
        }
        if (rendererMode === '3d') {
            const half = simDepth / 2 - r;
            if (this.z < -half) { this.z = -half; this.vz = Math.abs(this.vz) * rest + nudge; }
            else if (this.z > half) { this.z = half; this.vz = -Math.abs(this.vz) * rest - nudge; }
        } else {
            this.z = 0;
            this.vz = 0;
        }
    }

    relaxTemp() {
        this.tempC += (ambientTemp - this.tempC) * 0.045;
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy + this.vz * this.vz);
        const heat = clamp(this.tempC / 900, 0, 1);
        this.displayHeat = Math.max(heat, clamp(speed / MAX_SPEED, 0, 1) * 0.35);
    }

    recordTrail() {
        if (simMode !== 'fluid' || !ui.tracers.checked) {
            this.trailCount = 0;
            return;
        }
        const idx = this.trailIndex * 3;
        this.trail[idx] = this.x;
        this.trail[idx + 1] = this.y;
        this.trail[idx + 2] = this.z;
        this.trailIndex = (this.trailIndex + 1) % TRAIL_LENGTH;
        this.trailCount = Math.min(TRAIL_LENGTH, this.trailCount + 1);
    }

    draw() {
        const mat = materials[currentMaterialKey];
        const heat = this.displayHeat;
        const hue = lerp(mat.colorBase, 8, heat);
        const light = 42 + 48 * heat;
        ctx.beginPath();
        ctx.arc(this.x, this.y, particleRadius, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${hue}, ${72 + heat * 28}%, ${light}%)`;
        ctx.fill();

        if (simMode === 'fluid' && ui.tracers.checked && this.trailCount > 1) {
            ctx.strokeStyle = `rgba(255, 150, 100, ${0.16 + heat * 0.4})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < this.trailCount; i++) {
                const t = (this.trailIndex + i) % TRAIL_LENGTH;
                const tx = this.trail[t * 3];
                const ty = this.trail[t * 3 + 1];
                if (i === 0) ctx.moveTo(tx, ty);
                else ctx.lineTo(tx, ty);
            }
            ctx.stroke();
        }

        if (heat > 0.55) {
            ctx.fillStyle = `rgba(255, 110, 60, ${(heat - 0.55) * 0.55})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, particleRadius * 2.05, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function getHeatRadius() {
    return rendererMode === '3d' ? 96 : 88;
}

function particleColor(p, mat) {
    const heat = p.displayHeat;
    const hue = lerp(mat.colorBase, 8, heat);
    const light = 42 + 48 * heat;
    return hslToRgb(hue, 72 + heat * 28, light);
}

function solveLattice() {
    const mat = materials[currentMaterialKey];
    const use3d = rendererMode === '3d';
    const rest = physicsParams.latticeSpacing;
    const radius = physicsParams.interactionRadius;
    const radiusSq = radius * radius;

    if (brokenBonds.size) {
        for (const [key, frames] of brokenBonds) {
            if (frames <= 1) brokenBonds.delete(key);
            else brokenBonds.set(key, frames - 1);
        }
    }

    buildSpatialHash(radius);

    for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        forEachInCells(i, (j) => {
            if (j <= i) return;
            const p2 = particles[j];
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dz = use3d ? p2.z - p1.z : 0;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq > radiusSq || distSq < 1e-8) return;
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const nz = dz / dist;
            const pairTemp = (p1.tempC + p2.tempC) * 0.5;
            const phase = phaseAt(pairTemp, mat);
            const key = bondKey(i, j);
            const canBond = p1.neighborSet.has(j);
            const cooling = brokenBonds.has(key);

            if (canBond && !cooling && phase.solid > 0.2) {
                const stretch = dist / rest;
                if (stretch > physicsParams.breakStretch || stretch < 0.45) {
                    brokenBonds.set(key, 18);
                } else {
                    const k = physicsParams.bondStiffness * physicsParams.bondMult * phase.solid;
                    const relV = (p2.vx - p1.vx) * nx + (p2.vy - p1.vy) * ny + (p2.vz - p1.vz) * nz;
                    const impulse = (dist - rest) * k + relV * 0.3;
                    p1.vx += impulse * nx;
                    p1.vy += impulse * ny;
                    p1.vz += impulse * nz;
                    p2.vx -= impulse * nx;
                    p2.vy -= impulse * ny;
                    p2.vz -= impulse * nz;
                    return;
                }
            }

            if (dist < rest * 0.86) {
                const pen = rest * 0.86 - dist;
                const relV = (p2.vx - p1.vx) * nx + (p2.vy - p1.vy) * ny + (p2.vz - p1.vz) * nz;
                const imp = -pen * physicsParams.repulsion * 0.85 + Math.min(0, relV) * 0.18;
                p1.vx += imp * nx;
                p1.vy += imp * ny;
                p1.vz += imp * nz;
                p2.vx -= imp * nx;
                p2.vy -= imp * ny;
                p2.vz -= imp * nz;
            } else if (phase.liquid > 0.2 && dist < rest * 2.35) {
                const q = dist / rest;
                const fade = 1 - q / 2.35;
                const relV = (p2.vx - p1.vx) * nx + (p2.vy - p1.vy) * ny + (p2.vz - p1.vz) * nz;
                const spring = (q - 0.94) * physicsParams.cohesion * phase.liquid * fade * 1.35;
                const impulse = spring + relV * 0.32 * phase.liquid * fade;
                p1.vx += impulse * nx;
                p1.vy += impulse * ny;
                p1.vz += impulse * nz;
                p2.vx -= impulse * nx;
                p2.vy -= impulse * ny;
                p2.vz -= impulse * nz;
            } else if (phase.gas > 0.6 && dist < rest * 1.35) {
                const push = -(rest * 1.35 - dist) * physicsParams.repulsion * 0.22 * phase.gas;
                p1.vx += push * nx;
                p1.vy += push * ny;
                p1.vz += push * nz;
                p2.vx -= push * nx;
                p2.vy -= push * ny;
                p2.vz -= push * nz;
            }
        });
    }

    for (let i = 0; i < particles.length; i++) particles[i].integrate();
}

function solveFluid() {
    const h = fluidParams.smoothingRadius;
    const invH = 1 / h;
    const use3d = rendererMode === '3d';
    const mass = fluidParams.mass;
    const forceScale = 0.08;
    buildSpatialHash(h);

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const phase = phaseAt(p.tempC, materials[currentMaterialKey]);
        p.applyHeatAndJitter(phase);
        let density = 0;
        forEachInCells(i, (j) => {
            const pj = particles[j];
            const dx = pj.x - p.x;
            const dy = pj.y - p.y;
            const dz = use3d ? pj.z - p.z : 0;
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (dist < h) {
                const q = 1 - dist * invH;
                density += mass * q * q;
            }
        });
        p.density = Math.max(density, 0.08);
        const rest = fluidParams.restDensity * (0.7 + 0.3 * (1 - phase.gas));
        p.pressure = fluidParams.gasConstant * (p.density - rest);
        if (p.pressure < -fluidParams.gasConstant * 0.25) p.pressure = -fluidParams.gasConstant * 0.25;
    }

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        let fx = 0, fy = 0, fz = 0;
        let xsphX = 0, xsphY = 0, xsphZ = 0;
        const tensionOn = fluidParams.surfaceTension > 0
            && p.density < fluidParams.restDensity * fluidParams.surfaceThreshold;
        forEachInCells(i, (j) => {
            if (j === i) return;
            const pj = particles[j];
            const dx = pj.x - p.x;
            const dy = pj.y - p.y;
            const dz = use3d ? pj.z - p.z : 0;
            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (dist <= 1e-6 || dist >= h) return;
            const q = 1 - dist * invH;
            const w = q * q;
            const invD = 1 / dist;
            const dirX = dx * invD;
            const dirY = dy * invD;
            const dirZ = dz * invD;
            const pressure = (p.pressure + pj.pressure) * 0.5;
            const pForce = -pressure * q / Math.max(pj.density, 0.08);
            fx += dirX * pForce;
            fy += dirY * pForce;
            fz += dirZ * pForce;
            const visc = fluidParams.viscosity * w;
            fx += (pj.vx - p.vx) * visc;
            fy += (pj.vy - p.vy) * visc;
            fz += (pj.vz - p.vz) * visc;
            if (tensionOn) {
                const ten = fluidParams.surfaceTension * w;
                fx += dirX * ten;
                fy += dirY * ten;
                fz += dirZ * ten;
            }
            xsphX += (pj.vx - p.vx) * w;
            xsphY += (pj.vy - p.vy) * w;
            xsphZ += (pj.vz - p.vz) * w;
        });

        const invDensity = 1 / p.density;
        p.vx += clamp(fx * invDensity * forceScale, -3.2, 3.2);
        p.vy += clamp(fy * invDensity * forceScale, -3.2, 3.2) + physicsParams.gravity;
        if (use3d) p.vz += clamp(fz * invDensity * forceScale, -3.2, 3.2);
        if (fluidParams.xsph > 0) {
            const xs = fluidParams.xsph * invDensity * 0.18;
            p.vx += xs * xsphX;
            p.vy += xs * xsphY;
            if (use3d) p.vz += xs * xsphZ;
        }
        p.x += p.vx;
        p.y += p.vy;
        if (use3d) p.z += p.vz;
        p.vx *= 0.995;
        p.vy *= 0.995;
        p.vz *= 0.995;
        p.limitSpeed();
        p.applyBounds(phaseAt(p.tempC, materials[currentMaterialKey]));
        p.relaxTemp();
        p.recordTrail();
    }
}

function targetParticleCount() {
    const requested = ui.count ? parseInt(ui.count.value, 10) : 1200;
    if (isMobile) return clamp(requested, 120, 800);
    return clamp(requested, 200, 4000);
}

function initLattice() {
    particles = [];
    brokenBonds.clear();
    const mat = materials[currentMaterialKey];
    const lattice = physicsParams.latticeSpacing;
    const use3d = rendererMode === '3d';
    const maxParticles = targetParticleCount();
    const phase = phaseAt(ambientTemp, mat);
    particleRadius = Math.max(2.1, lattice * 0.4);

    if (phase.gas > 0.7) {
        for (let i = 0; i < maxParticles; i++) {
            const x = particleRadius + Math.random() * (simWidth - particleRadius * 2);
            const y = particleRadius + Math.random() * (simHeight - particleRadius * 2);
            const z = use3d ? (Math.random() - 0.5) * (simDepth - particleRadius * 2) : 0;
            const p = new Particle(x, y, z);
            particles.push(p);
        }
        latticeRows = 1;
        latticeCols = maxParticles;
        latticeLayers = 1;
        syncCountLabel();
        if (rendererMode === '3d' && scene) rebuild3DBuffers();
        return;
    }

    let cols = Math.max(6, Math.floor(simWidth / lattice));
    let rows = Math.max(6, Math.floor(simHeight / (lattice * 0.866)));
    let layers = use3d ? Math.max(2, Math.floor(simDepth / lattice)) : 1;
    let total = rows * cols * layers;
    if (total > maxParticles) {
        if (use3d) {
            const scale = Math.cbrt(maxParticles / total);
            cols = Math.max(4, Math.floor(cols * scale));
            rows = Math.max(4, Math.floor(rows * scale));
            layers = Math.max(2, Math.floor(layers * scale));
        } else {
            const scale = Math.sqrt(maxParticles / total);
            cols = Math.max(6, Math.floor(cols * scale));
            rows = Math.max(6, Math.floor(rows * scale));
        }
        total = rows * cols * layers;
    }

    latticeRows = rows;
    latticeCols = cols;
    latticeLayers = layers;
    const startX = (simWidth - (cols * lattice)) / 2;
    const startY = (simHeight - (rows * lattice * 0.866)) / 2;
    const startZ = use3d ? -((layers - 1) * lattice) / 2 : 0;
    const indexAt = new Int32Array(rows * cols * layers);
    indexAt.fill(-1);

    let created = 0;
    const target = Math.min(maxParticles, total);
    for (let layer = 0; layer < layers; layer++) {
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                if (created >= target) break;
                const xOffset = (row % 2 === 0) ? 0 : lattice / 2;
                const x = startX + col * lattice + xOffset + (Math.random() - 0.5) * 1.2;
                const y = startY + row * (lattice * 0.866) + (Math.random() - 0.5) * 1.2;
                const z = use3d ? startZ + layer * lattice + (Math.random() - 0.5) * 1.2 : 0;
                const p = new Particle(x, y, z);
                indexAt[layer * rows * cols + row * cols + col] = created;
                particles.push(p);
                created++;
            }
            if (created >= target) break;
        }
        if (created >= target) break;
    }

    const tryAdd = (p, rr, cc, ll) => {
        if (rr < 0 || rr >= rows || cc < 0 || cc >= cols || ll < 0 || ll >= layers) return;
        const idx = indexAt[ll * rows * cols + rr * cols + cc];
        if (idx >= 0) p.neighborSet.add(idx);
    };

    for (let layer = 0; layer < layers; layer++) {
        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                const idx = indexAt[layer * rows * cols + row * cols + col];
                if (idx < 0) continue;
                const p = particles[idx];
                tryAdd(p, row, col - 1, layer);
                tryAdd(p, row, col + 1, layer);
                if (row % 2 === 0) {
                    tryAdd(p, row - 1, col - 1, layer);
                    tryAdd(p, row - 1, col, layer);
                    tryAdd(p, row + 1, col - 1, layer);
                    tryAdd(p, row + 1, col, layer);
                } else {
                    tryAdd(p, row - 1, col, layer);
                    tryAdd(p, row - 1, col + 1, layer);
                    tryAdd(p, row + 1, col, layer);
                    tryAdd(p, row + 1, col + 1, layer);
                }
                if (use3d) {
                    tryAdd(p, row, col, layer - 1);
                    tryAdd(p, row, col, layer + 1);
                }
            }
        }
    }

    syncCountLabel();
    if (rendererMode === '3d' && scene) rebuild3DBuffers();
}

function assignProximityBonds() {
    if (!particles.length) return;
    const rest = physicsParams.latticeSpacing;
    const maxDist = rest * 1.22;
    const maxDistSq = maxDist * maxDist;
    const use3d = rendererMode === '3d';
    buildSpatialHash(maxDist);
    for (let i = 0; i < particles.length; i++) particles[i].neighborSet.clear();
    for (let i = 0; i < particles.length; i++) {
        const p1 = particles[i];
        forEachInCells(i, (j) => {
            if (j <= i) return;
            const p2 = particles[j];
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dz = use3d ? p2.z - p1.z : 0;
            const distSq = dx * dx + dy * dy + dz * dz;
            if (distSq > maxDistSq || distSq < 1e-8) return;
            if (p1.neighborSet.size < 8) p1.neighborSet.add(j);
            if (p2.neighborSet.size < 8) p2.neighborSet.add(i);
        });
    }
}

function syncCountLabel() {
    if (!ui.countVal) return;
    ui.countVal.textContent = String(particles.length);
}

function draw2D() {
    if (simMode === 'fluid' && ui.tracers.checked) {
        ctx.fillStyle = 'rgba(12, 13, 16, 0.32)';
    } else {
        ctx.fillStyle = '#0c0d10';
    }
    ctx.fillRect(0, 0, simWidth, simHeight);

    for (let i = 0; i < particles.length; i++) particles[i].draw();

    if (mouse.isDown && rendererMode === '2d') {
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, getHeatRadius(), 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 170, 120, 0.28)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
}

function updateHeatPointFromPointer(x, y) {
    if (rendererMode !== '3d' || !camera || !window.THREE) {
        heatPoint.valid = false;
        return;
    }
    const THREE = window.THREE;
    if (!raycaster) raycaster = new THREE.Raycaster();
    if (!heatPlane) heatPlane = new THREE.Plane();
    if (!heatHit) heatHit = new THREE.Vector3();
    if (!heatLook) heatLook = new THREE.Vector3();

    camera.getWorldDirection(heatLook);
    heatPlane.setFromNormalAndCoplanarPoint(heatLook, new THREE.Vector3(panX, panY, 0));
    const rect = canvas3d.getBoundingClientRect();
    const nx = ((x - rect.left) / rect.width) * 2 - 1;
    const ny = -((y - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera({ x: nx, y: ny }, camera);
    if (raycaster.ray.intersectPlane(heatPlane, heatHit)) {
        heatPoint.x = heatHit.x;
        heatPoint.y = heatHit.y;
        heatPoint.z = heatHit.z;
        heatPoint.valid = true;
    } else {
        heatPoint.valid = false;
    }
}

function updateInstructions() {
    if (!ui.instructions) return;
    if (rendererMode === '3d') {
        ui.instructions.textContent = 'Drag to orbit · Scroll to zoom · Right-drag to pan · Shift-drag to heat · Space pauses';
        return;
    }
    ui.instructions.textContent = isMobile
        ? 'Drag to inject heat. Hot spots melt solids and stir fluids. Space pauses.'
        : 'Click and drag to inject heat. Hot spots melt solids and stir fluids. Space pauses.';
}

function resetCamera() {
    panX = 0;
    panY = 0;
    orbitYaw = 0.55;
    orbitPitch = 0.32;
    const n = Math.max(1, particles.length);
    const span = physicsParams.latticeSpacing * Math.max(8, Math.cbrt(n) * 2.4);
    orbitDistance = clamp(span * 2.15, 180, Math.max(simWidth, simHeight, simDepth) * 0.9);
}

function updateBoundsMesh() {
    if (!window.THREE || !scene) return;
    const THREE = window.THREE;
    if (boundsGeometry) boundsGeometry.dispose();
    boundsGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(simWidth, simHeight, simDepth));
    if (!boundsMesh) {
        boundsMesh = new THREE.LineSegments(
            boundsGeometry,
            new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.16 })
        );
        scene.add(boundsMesh);
    } else {
        boundsMesh.geometry = boundsGeometry;
    }
    boundsMesh.visible = !!(ui.bounds && ui.bounds.checked);
}

function updateVolumeMesh() {
    if (!window.THREE || !scene) return;
    if (volumeFrame++ % 6 !== 0) return;
    const mat = materials[currentMaterialKey];
    const phase = phaseAt(ambientTemp, mat);
    const farZoom = orbitDistance > 520;
    if (phase.gas < 0.5 || !farZoom) {
        if (volumeMesh) volumeMesh.visible = false;
        return;
    }

    const THREE = window.THREE;
    const grid = 18;
    const cells = grid * grid * grid;
    const accCount = new Float32Array(cells);
    const cx = simWidth / 2;
    const cy = simHeight / 2;
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const ix = clamp(Math.floor((p.x / simWidth) * grid), 0, grid - 1);
        const iy = clamp(Math.floor((p.y / simHeight) * grid), 0, grid - 1);
        const iz = clamp(Math.floor(((p.z + simDepth / 2) / simDepth) * grid), 0, grid - 1);
        accCount[iz * grid * grid + iy * grid + ix] += 1;
    }

    const cellX = simWidth / grid;
    const cellY = simHeight / grid;
    const cellZ = simDepth / grid;
    const rgb = hslToRgb(mat.colorBase, 70, 55);
    const needed = cells * 3;
    if (!volumePositions || volumePositions.length < needed) {
        volumePositions = new Float32Array(needed);
        volumeColors = new Float32Array(cells * 4);
        if (!volumeGeometry) volumeGeometry = new THREE.BufferGeometry();
        volumeGeometry.setAttribute('position', new THREE.BufferAttribute(volumePositions, 3));
        volumeGeometry.setAttribute('color', new THREE.BufferAttribute(volumeColors, 4));
    }

    let out = 0;
    let col = 0;
    const alphaScale = clamp((orbitDistance - 400) / 900, 0.15, 0.9);
    for (let iz = 0; iz < grid; iz++) {
        for (let iy = 0; iy < grid; iy++) {
            for (let ix = 0; ix < grid; ix++) {
                const count = accCount[iz * grid * grid + iy * grid + ix];
                if (count <= 0) continue;
                const x = -cx + (ix + 0.5) * cellX;
                const y = -(-cy + (iy + 0.5) * cellY);
                const z = -simDepth / 2 + (iz + 0.5) * cellZ;
                volumePositions[out++] = x;
                volumePositions[out++] = y;
                volumePositions[out++] = z;
                const a = Math.min(1, count / 3) * alphaScale;
                volumeColors[col++] = rgb.r / 255;
                volumeColors[col++] = rgb.g / 255;
                volumeColors[col++] = rgb.b / 255;
                volumeColors[col++] = a;
            }
        }
    }

    volumeGeometry.setDrawRange(0, out / 3);
    volumeGeometry.attributes.position.needsUpdate = true;
    volumeGeometry.attributes.color.needsUpdate = true;
    if (!volumeMaterial) {
        volumeMaterial = new THREE.PointsMaterial({
            size: 12,
            transparent: true,
            vertexColors: true,
            opacity: 0.85,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });
    }
    if (!volumeMesh) {
        volumeMesh = new THREE.Points(volumeGeometry, volumeMaterial);
        volumeMesh.frustumCulled = false;
        scene.add(volumeMesh);
    }
    volumeMesh.visible = out > 0;
}

function ensureThree() {
    if (window.THREE) return Promise.resolve(window.THREE);
    if (threeLoad) return threeLoad;
    threeLoad = import('https://unpkg.com/three@0.160.0/build/three.module.js')
        .then((mod) => {
            window.THREE = mod;
            return window.THREE;
        });
    return threeLoad;
}

function rebuild3DBuffers() {
    if (!window.THREE || !scene) return;
    const THREE = window.THREE;
    const count = particles.length;
    positions = new Float32Array(count * 3);
    colors = new Float32Array(count * 3);
    if (geometry) geometry.dispose();
    geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    if (!pointsMaterial) {
        pointsMaterial = new THREE.PointsMaterial({
            size: 7,
            vertexColors: true,
            transparent: true,
            opacity: 1,
            sizeAttenuation: true
        });
    }
    if (points) scene.remove(points);
    points = new THREE.Points(geometry, pointsMaterial);
    points.frustumCulled = false;
    scene.add(points);

    if (tracerMesh) scene.remove(tracerMesh);
    if (tracerGeometry) tracerGeometry.dispose();
    tracerGeometry = new THREE.BufferGeometry();
    tracerPositions = new Float32Array(Math.max(1, count * (TRAIL_LENGTH - 1) * 6));
    tracerGeometry.setAttribute('position', new THREE.BufferAttribute(tracerPositions, 3));
    if (!tracerMaterial) {
        tracerMaterial = new THREE.LineBasicMaterial({
            color: 0xff9966,
            transparent: true,
            opacity: 0.45
        });
    }
    tracerMesh = new THREE.LineSegments(tracerGeometry, tracerMaterial);
    tracerMesh.frustumCulled = false;
    scene.add(tracerMesh);
    updateBoundsMesh();
}

function init3D() {
    if (!window.THREE) return;
    const THREE = window.THREE;
    if (!renderer3d) {
        renderer3d = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: !isMobile });
        renderer3d.setClearColor(0x0c0d10, 1);
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, simWidth / Math.max(1, simHeight), 1, 9000);
        renderer3d.setPixelRatio(dpr);
    }
    renderer3d.setSize(simWidth, simHeight, false);
    camera.aspect = simWidth / Math.max(1, simHeight);
    camera.updateProjectionMatrix();
    rebuild3DBuffers();
}

function draw3D() {
    if (!renderer3d || !points || !geometry || !camera) return;
    const mat = materials[currentMaterialKey];
    const centerX = simWidth / 2;
    const centerY = simHeight / 2;
    const cp = Math.cos(orbitPitch);
    camera.position.set(
        orbitDistance * Math.sin(orbitYaw) * cp + panX,
        orbitDistance * Math.sin(orbitPitch) + panY,
        orbitDistance * Math.cos(orbitYaw) * cp
    );
    camera.lookAt(panX, panY, 0);

    const extent = Math.max(simWidth, simHeight, simDepth);
    const desiredFar = Math.max(2500, orbitDistance + extent * 2);
    if (Math.abs(desiredFar - cameraFar) > 80) {
        cameraFar = desiredFar;
        camera.far = cameraFar;
        camera.updateProjectionMatrix();
    }

    if (pointsMaterial) {
        const phase = phaseAt(ambientTemp, mat);
        pointsMaterial.size = phase.gas > 0.5 ? 5.5 : 7.2;
        pointsMaterial.opacity = phase.gas > 0.5 ? 0.72 : 1;
    }
    if (boundsMesh) boundsMesh.visible = !!(ui.bounds && ui.bounds.checked);

    if (tracerMesh) {
        const enable = ui.tracers.checked && simMode === 'fluid';
        tracerMesh.visible = enable;
        if (enable) {
            let out = 0;
            const max = tracerPositions.length;
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                if (p.trailCount < 2) continue;
                for (let k = 0; k < p.trailCount - 1; k++) {
                    if (out + 6 > max) break;
                    const a = (p.trailIndex + k) % TRAIL_LENGTH;
                    const b = (p.trailIndex + k + 1) % TRAIL_LENGTH;
                    tracerPositions[out++] = p.trail[a * 3] - centerX;
                    tracerPositions[out++] = -(p.trail[a * 3 + 1] - centerY);
                    tracerPositions[out++] = p.trail[a * 3 + 2];
                    tracerPositions[out++] = p.trail[b * 3] - centerX;
                    tracerPositions[out++] = -(p.trail[b * 3 + 1] - centerY);
                    tracerPositions[out++] = p.trail[b * 3 + 2];
                }
            }
            tracerGeometry.setDrawRange(0, out / 3);
            tracerGeometry.attributes.position.needsUpdate = true;
        }
    }

    updateVolumeMesh();

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const idx = i * 3;
        positions[idx] = p.x - centerX;
        positions[idx + 1] = -(p.y - centerY);
        positions[idx + 2] = p.z;
        const rgb = particleColor(p, mat);
        colors[idx] = rgb.r / 255;
        colors[idx + 1] = rgb.g / 255;
        colors[idx + 2] = rgb.b / 255;
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;
    renderer3d.render(scene, camera);
}

function setRenderer(mode) {
    const want3d = mode === '3d' && !isMobile;
    if (!want3d) {
        rendererMode = '2d';
        document.body.classList.remove('renderer-3d');
        if (ui.renderer) ui.renderer.value = '2d';
        canvas.style.display = 'block';
        canvas3d.style.display = 'none';
        initLattice();
        updateInstructions();
        return;
    }
    if (ui.hudSub) ui.hudSub.textContent = 'Loading 3D…';
    ensureThree()
        .then(() => {
            rendererMode = '3d';
            document.body.classList.add('renderer-3d');
            if (ui.renderer) ui.renderer.value = '3d';
            canvas.style.display = 'none';
            canvas3d.style.display = 'block';
            init3D();
            initLattice();
            resetCamera();
            updateInstructions();
        })
        .catch((err) => {
            console.warn(err);
            rendererMode = '2d';
            document.body.classList.remove('renderer-3d');
            canvas.style.display = 'block';
            canvas3d.style.display = 'none';
            if (ui.renderer) ui.renderer.value = '2d';
            initLattice();
            updateInstructions();
            if (ui.hudSub) ui.hudSub.textContent = '3D failed to load · back in 2D';
        });
}

function updatePhysics() {
    currentMaterialKey = ui.material.value;
    const mat = materials[currentMaterialKey];
    simMode = ui.mode.value;
    ambientTemp = clamp(parseInt(ui.tempSlider.value, 10) || 0, TEMP_MIN, TEMP_MAX);
    physicsParams.bondMult = (parseInt(ui.bond.value, 10) || 0) / 50;
    document.body.classList.toggle('mode-fluid', simMode === 'fluid');
    document.body.classList.toggle('phase-gas', phaseAt(ambientTemp, mat).gas > 0.5);
    physicsParams.latticeSpacing = BASE_SPACING * (mat.latticeScale || 1);
    physicsParams.friction = mat.friction;
    physicsParams.repulsion = mat.repulsion;
    physicsParams.cohesion = mat.cohesion * Math.max(0.3, physicsParams.bondMult);
    physicsParams.bondStiffness = mat.bondStiffness;
    physicsParams.breakStretch = mat.breakStretch;
    physicsParams.interactionRadius = physicsParams.latticeSpacing * 2.6;
    physicsParams.jitter = clamp((ambientTemp - TEMP_MIN) / (TEMP_MAX - TEMP_MIN), 0, 1) * 1.15;
    particleRadius = Math.max(2.1, physicsParams.latticeSpacing * 0.4);

    const gravSlider = (parseInt(ui.grav.value, 10) || 0) / 100;
    const densityScale = clamp(Math.sqrt(Math.max(0.05, mat.density)) / 2.2, 0.35, 1.35);
    physicsParams.gravity = gravSlider * 0.1 * densityScale;

    if (simMode === 'fluid') {
        fluidParams.viscosity = (parseInt(ui.visc.value, 10) || 0) / 100;
        fluidParams.gasConstant = 6 + (parseInt(ui.comp.value, 10) || 0) * 0.72;
        fluidParams.surfaceTension = (parseInt(ui.surf.value, 10) || 0) / 100;
        fluidParams.xsph = (parseInt(ui.xsph.value, 10) || 0) / 100;
        fluidParams.smoothingRadius = Math.max(18, physicsParams.latticeSpacing * 2.35);
        fluidParams.restDensity = rendererMode === '3d' ? 16 : 11;
        if (ui.viscVal) ui.viscVal.textContent = fluidParams.viscosity.toFixed(2);
        if (ui.compVal) ui.compVal.textContent = String(parseInt(ui.comp.value, 10) || 0);
        if (ui.surfVal) ui.surfVal.textContent = fluidParams.surfaceTension.toFixed(2);
        if (ui.xsphVal) ui.xsphVal.textContent = fluidParams.xsph.toFixed(2);
    }

    if (ui.gravVal) ui.gravVal.textContent = String(parseInt(ui.grav.value, 10) || 0);
    if (ui.tempInput && document.activeElement !== ui.tempInput) {
        if (parseInt(ui.tempInput.value, 10) !== ambientTemp) ui.tempInput.value = ambientTemp;
    }
    if (ui.bondVal) {
        const b = physicsParams.bondMult;
        ui.bondVal.textContent = simMode === 'fluid' ? 'N/A' : (b < 0.7 ? 'Low' : (b < 1.4 ? 'Medium' : 'High'));
    }
    if (ui.phaseHint) {
        const phase = phaseAt(ambientTemp, mat);
        const names = { iron: 'Iron', gold: 'Gold', fluid: 'Water', oxygen: 'Oxygen', nitrogen: 'Nitrogen', argon: 'Argon' };
        ui.phaseHint.textContent = `${names[currentMaterialKey] || currentMaterialKey} is ${phaseLabel(phase)} · melts ${Math.round(mat.meltTemp)}°C · boils ${Math.round(mat.boilTemp)}°C`;
    }
    if (boundsMesh) boundsMesh.visible = !!(ui.bounds && ui.bounds.checked);

    const materialChanged = lastMaterialKey !== null && lastMaterialKey !== currentMaterialKey;
    lastMaterialKey = currentMaterialKey;
    if (materialChanged) initLattice();

    const phase = phaseAt(ambientTemp, mat);
    if (phase.solid > 0.7 && particles.length && particles[0].neighborSet.size === 0) {
        assignProximityBonds();
    }
}

function setAmbientTemp(value) {
    const v = clamp(Math.round(value), TEMP_MIN, TEMP_MAX);
    ui.tempSlider.value = v;
    ui.tempInput.value = v;
    updatePhysics();
}

function updateHud() {
    const mat = materials[currentMaterialKey];
    const phase = phaseLabel(phaseAt(ambientTemp, mat));
    const pauseText = paused ? 'Paused · ' : '';
    ui.hudMain.textContent = `${pauseText}${particles.length} particles · ${Math.round(fps)} FPS`;
    ui.hudSub.textContent = `${currentMaterialKey} · ${phase} · ${simMode === 'fluid' ? 'SPH' : 'lattice'} · ${rendererMode.toUpperCase()}`;
}

function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    fps = fps * 0.9 + (1 / Math.max(dt, 1 / 120)) * 0.1;

    if (!paused) {
        acc += dt;
        let steps = 0;
        while (acc >= FIXED_DT && steps < 3) {
            if (simMode === 'fluid') solveFluid();
            else solveLattice();
            acc -= FIXED_DT;
            steps++;
        }
        if (steps === 3) acc = 0;
    }

    if (rendererMode === '2d') draw2D();
    else draw3D();

    if (++hudTick % 10 === 0) updateHud();
}

function resize() {
    simWidth = window.innerWidth;
    simHeight = window.innerHeight;
    simDepth = clamp(Math.min(simWidth, simHeight) * 0.5, 180, 560);
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.style.width = simWidth + 'px';
    canvas.style.height = simHeight + 'px';
    canvas.width = Math.floor(simWidth * dpr);
    canvas.height = Math.floor(simHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    canvas3d.style.width = simWidth + 'px';
    canvas3d.style.height = simHeight + 'px';
    if (renderer3d && camera) {
        camera.aspect = simWidth / Math.max(1, simHeight);
        camera.updateProjectionMatrix();
        renderer3d.setPixelRatio(dpr);
        renderer3d.setSize(simWidth, simHeight, false);
        updateBoundsMesh();
    }
}

function isUiTarget(target) {
    const controls = document.getElementById('controls');
    return !!(controls && target && controls.contains(target));
}

function isTypingTarget(target) {
    if (!target || !target.tagName) return false;
    const tag = target.tagName;
    return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || target.isContentEditable;
}

window.addEventListener('resize', resize);

window.addEventListener('pointerdown', (e) => {
    if (isUiTarget(e.target)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (rendererMode === '3d') {
        if (activePointers.size === 1) {
            if (e.shiftKey) {
                cameraDrag = false;
                panDrag = false;
            } else if (e.button === 2 || e.button === 1) {
                panDrag = true;
                lastPanX = e.clientX;
                lastPanY = e.clientY;
            } else {
                cameraDrag = true;
                lastPointerX = e.clientX;
                lastPointerY = e.clientY;
            }
        } else if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            lastPinchDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            lastPanX = (pts[0].x + pts[1].x) / 2;
            lastPanY = (pts[0].y + pts[1].y) / 2;
        }
    }
    mouse.isDown = rendererMode !== '3d' || e.shiftKey;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    updateHeatPointFromPointer(e.clientX, e.clientY);
    if (e.target && e.target.setPointerCapture) {
        try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
});

window.addEventListener('pointermove', (e) => {
    if (activePointers.has(e.pointerId)) {
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }
    if (rendererMode === '3d') {
        if (activePointers.size === 2 && lastPinchDistance && !e.shiftKey) {
            const pts = Array.from(activePointers.values());
            const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            orbitDistance = clamp(orbitDistance - (dist - lastPinchDistance) * 1.2, 140, 6000);
            lastPinchDistance = dist;
            const cx = (pts[0].x + pts[1].x) / 2;
            const cy = (pts[0].y + pts[1].y) / 2;
            const panScale = orbitDistance / 500;
            panX -= (cx - lastPanX) * panScale;
            panY += (cy - lastPanY) * panScale;
            lastPanX = cx;
            lastPanY = cy;
        } else if (cameraDrag && activePointers.size === 1 && !e.shiftKey) {
            orbitYaw += (e.clientX - lastPointerX) * 0.005;
            orbitPitch = clamp(orbitPitch + (e.clientY - lastPointerY) * 0.005, -1.2, 1.2);
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
        } else if (panDrag && activePointers.size === 1 && !e.shiftKey) {
            const panScale = orbitDistance / 500;
            panX -= (e.clientX - lastPanX) * panScale;
            panY += (e.clientY - lastPanY) * panScale;
            lastPanX = e.clientX;
            lastPanY = e.clientY;
        }
    }
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    updateHeatPointFromPointer(e.clientX, e.clientY);
});

function endPointer(e) {
    activePointers.delete(e.pointerId);
    if (activePointers.size < 2) lastPinchDistance = null;
    if (activePointers.size === 0) {
        mouse.isDown = false;
        cameraDrag = false;
        panDrag = false;
        heatPoint.valid = false;
    }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

canvas3d.addEventListener('wheel', (e) => {
    if (rendererMode !== '3d' || e.shiftKey) return;
    e.preventDefault();
    orbitDistance = clamp(orbitDistance + e.deltaY * 0.9, 140, 6000);
}, { passive: false });

window.addEventListener('contextmenu', (e) => {
    if (rendererMode === '3d' && canvas3d.contains(e.target)) e.preventDefault();
});

window.addEventListener('keydown', (e) => {
    if (isTypingTarget(e.target)) return;
    if (e.code === 'Space') {
        e.preventDefault();
        setPaused(!paused);
        return;
    }
    if (rendererMode !== '3d') return;
    const key = e.key.toLowerCase();
    const panStep = orbitDistance / 50;
    if (e.key === 'ArrowLeft') orbitYaw -= 0.06;
    if (e.key === 'ArrowRight') orbitYaw += 0.06;
    if (e.key === 'ArrowUp') orbitPitch = clamp(orbitPitch - 0.06, -1.2, 1.2);
    if (e.key === 'ArrowDown') orbitPitch = clamp(orbitPitch + 0.06, -1.2, 1.2);
    if (e.key === '+' || e.key === '=') orbitDistance = Math.max(140, orbitDistance - 80);
    if (e.key === '-' || e.key === '_') orbitDistance = Math.min(6000, orbitDistance + 80);
    if (key === 'w') panY += panStep;
    if (key === 's') panY -= panStep;
    if (key === 'a') panX -= panStep;
    if (key === 'd') panX += panStep;
});

canvas.style.touchAction = 'none';
canvas3d.style.touchAction = 'none';

function setPaused(next) {
    paused = next;
    if (ui.pause) ui.pause.textContent = paused ? 'Resume' : 'Pause';
    updateHud();
}

function bindUi() {
    ui.material.addEventListener('change', updatePhysics);
    ui.tempSlider.addEventListener('input', updatePhysics);
    ui.bond.addEventListener('input', updatePhysics);
    ui.grav.addEventListener('input', updatePhysics);
    ui.reset.addEventListener('click', initLattice);
    ui.pause.addEventListener('click', () => setPaused(!paused));
    ui.mode.addEventListener('change', () => {
        updatePhysics();
        initLattice();
    });
    ui.visc.addEventListener('input', updatePhysics);
    ui.comp.addEventListener('input', updatePhysics);
    ui.surf.addEventListener('input', updatePhysics);
    ui.xsph.addEventListener('input', updatePhysics);
    ui.bounds.addEventListener('change', updatePhysics);
    ui.tracers.addEventListener('change', updatePhysics);
    ui.resetView.addEventListener('click', resetCamera);

    let countTimer = 0;
    ui.count.addEventListener('input', () => {
        ui.countVal.textContent = ui.count.value;
        ui.countHint.textContent = 'Updating…';
        clearTimeout(countTimer);
        countTimer = setTimeout(() => {
            initLattice();
            ui.countHint.textContent = isMobile
                ? 'Capped on this device for performance.'
                : 'Updates after you pause dragging.';
        }, 180);
    });

    ui.tempInput.addEventListener('input', () => {
        let v = parseInt(ui.tempInput.value, 10);
        if (Number.isNaN(v)) return;
        v = clamp(v, TEMP_MIN, TEMP_MAX);
        ui.tempSlider.value = String(v);
        ambientTemp = v;
        updatePhysics();
    });
    ui.tempInput.addEventListener('blur', () => {
        const v = parseInt(ui.tempInput.value, 10);
        setAmbientTemp(Number.isNaN(v) ? ambientTemp : v);
    });

    ui.roomChip.addEventListener('click', () => setAmbientTemp(20));
    ui.meltChip.addEventListener('click', () => setAmbientTemp(materials[currentMaterialKey].meltTemp));
    ui.boilChip.addEventListener('click', () => setAmbientTemp(Math.min(TEMP_MAX, materials[currentMaterialKey].boilTemp)));

    if (isMobile) {
        const opt3d = ui.renderer.querySelector('option[value="3d"]');
        if (opt3d) opt3d.disabled = true;
        ui.count.max = '800';
        ui.count.value = '280';
    }
    ui.renderer.addEventListener('change', (e) => setRenderer(e.target.value));

    const controls = document.getElementById('controls');
    const btn = controls.querySelector('.minimize-button');
    const setCollapsed = (collapsed) => {
        controls.classList.toggle('collapsed', collapsed);
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.textContent = collapsed ? '☰' : '–';
        btn.title = collapsed ? 'Open panel' : 'Collapse panel';
    };
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setCollapsed(!controls.classList.contains('collapsed'));
    });
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !controls.classList.contains('collapsed') && !isTypingTarget(e.target)) {
            setCollapsed(true);
        }
    });
    if (isMobile) setCollapsed(true);
}

window.getSimSnapshot = function getSimSnapshot() {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, v2 = 0;
    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
        v2 += p.vx * p.vx + p.vy * p.vy + p.vz * p.vz;
    }
    const n = Math.max(1, particles.length);
    return {
        n: particles.length,
        width: maxX - minX,
        height: maxY - minY,
        minY, maxY, minX, maxX,
        rms: Math.sqrt(v2 / n),
        mode: simMode,
        renderer: rendererMode,
        material: currentMaterialKey
    };
};

bindUi();
resize();
updatePhysics();
initLattice();
updateInstructions();
if (isMobile) {
    ui.countHint.textContent = 'Capped on this device for performance.';
}
requestAnimationFrame(animate);
</script>
